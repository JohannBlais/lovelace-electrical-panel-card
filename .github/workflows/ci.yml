name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # CARD_VERSION is injected from package.json at build time and surfaces
      # only in the console banner — which is how you tell builds apart in a
      # live Home Assistant. Assert it against the bundle that actually ships
      # rather than the source it was derived from, so a broken injection
      # cannot pass by leaving the placeholder in place.
      - name: Verify the bundle reports the package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -qF "v$version " dist/electrical-panel-card.js; then
            echo "::error::dist/electrical-panel-card.js does not report v$version"
            exit 1
          fi
          echo "Bundle reports v$version."

      # Drive the built bundle in jsdom and exercise what rendering alone
      # cannot reach: opening the metadata dialog, its markup contract with
      # HA's <ha-dialog>, and the fireEvent call behind "More info". #19
      # shipped precisely because nothing here opened a dialog.
      - name: Interaction smoke test
        run: npm run smoke-test

      # Render the example YAMLs through the freshly built bundle inside
      # jsdom. Doubles as a sanity test (the script throws on any render
      # error) and as drift detection (the commit fails if the regenerated
      # SVGs no longer match the ones checked into the repo, forcing devs
      # to refresh assets/ after layout / icon / wording changes).
      - name: Generate previews
        run: npm run generate-previews

      - name: Verify previews are up to date
        run: |
          if ! git diff --quiet -- assets/; then
            echo "::error::Preview SVGs are out of date. Run 'npm run generate-previews' locally and commit the updated assets/."
            git diff --stat -- assets/
            git diff -- assets/ | head -200
            exit 1
          fi
          echo "Previews are up to date."
